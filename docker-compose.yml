version: '3.8'

services:
  rtvr:
    image: postgres:15-alpine
    container_name: rtvr
    environment:
      POSTGRES_USER: rtvr_user
      POSTGRES_PASSWORD: rtvr_password
      POSTGRES_DB: rtvr_db
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: rtvr-minio
    environment:
      MINIO_ROOT_USER: rtvr_minio
      MINIO_ROOT_PASSWORD: rtvr_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
